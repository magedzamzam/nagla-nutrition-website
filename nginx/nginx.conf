user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Trust the OCI Load Balancer's forwarded headers
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Gzip compression for SEO performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/rss+xml application/atom+xml
        image/svg+xml font/woff font/woff2;

    # Increase client body size for video uploads (200MB)
    client_max_body_size 210M;
    client_body_timeout 300s;

    # Logging format includes original client IP from LB
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '"$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80 default_server;
        server_name drnaglanutrition.com www.drnaglanutrition.com;
		
		location / {
			proxy_pass http://localhost:3000;
		}
		
        # Health check for OCI Load Balancer
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # API proxy to Node backend
        location /api/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Uploaded media (served directly for performance)
        location /uploads/ {
            alias /app/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;

            # CORS for media (in case of future CDN)
            add_header Access-Control-Allow-Origin "*";

            # Allow video range requests for streaming
            location ~* \.(mp4|webm|mov)$ {
                mp4;
                mp4_buffer_size 1m;
                mp4_max_buffer_size 5m;
            }
        }

        # Sitemap & robots — proxy to Node so they can be dynamic
        location = /sitemap.xml {
            proxy_pass http://127.0.0.1:3001/api/seo/sitemap.xml;
        }
        location = /robots.txt {
            proxy_pass http://127.0.0.1:3001/api/seo/robots.txt;
        }

        # Static React assets — long cache
        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # SPA fallback — every other route returns index.html
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;

            # Don't cache index.html so deploys are picked up immediately
            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }
}
